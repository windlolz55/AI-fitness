<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>AI ?箄憌脤?蝝??/title>
    <link rel="stylesheet" href="style.css?v=1.46">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

    
    <script>
        if (localStorage.getItem('fitness_theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }
    </script>
    
    <div id="global-loader" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: var(--bg-main); z-index: 9999;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 40px; color: var(--accent-primary);"></i>
    </div>
    
    <div class="app-container">
        
        <!-- Auth View -->
        <div id="view-auth" class="view" style="display: none; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 24px;">
            <div style="text-align: center; margin-bottom: 32px;">
                <div style="width: 80px; height: 80px; background: var(--accent-primary); border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 40px; color: white; margin-bottom: 16px;">
                    <i class="fa-solid fa-dumbbell"></i>
                </div>
                <h1 style="font-size: 24px; margin: 0; color: var(--text-main);">AI Fitness <span style="font-size: 14px; color: var(--text-muted); opacity: 0.7;">v1.60</span></h1>
                <p style="color: var(--text-muted); margin-top: 8px;">?餃隞亙?甇交??撅祉???/p>
            </div>
            
            <div class="card" style="width: 100%; padding: 24px;">
                <div class="input-group">
                    <label>?餃?靽∠拳</label>
                    <input type="email" id="auth-email" class="input-field" placeholder="example@email.com" onkeydown="if(event.key === 'Enter') handleLogin()">
                </div>
                <div class="input-group">
                    <label>撖Ⅳ</label>
                    <input type="password" id="auth-password" class="input-field" placeholder="隢撓?亙?蝣? onkeydown="if(event.key === 'Enter') handleLogin()">
                </div>
                
                <div id="auth-error" style="color: #ff4757; font-size: 14px; margin-bottom: 16px; display: none;"></div>
                
                <button class="btn-primary" style="width: 100%; margin-bottom: 12px;" onclick="handleLogin()">?餃</button>
                <button class="btn-secondary" style="width: 100%;" onclick="handleSignup()">閮餃??啣董??/button>
            </div>
        </div>
        
        <!-- Main App Wrapper (Hidden until logged in) -->
        <div id="main-app" style="display: none; height: 100%; width: 100%;">
            <!-- Dashboard View -->
        <div id="view-dashboard" class="view active">
            <header class="dashboard-header">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <p id="date-display" style="font-size: 14px; color: var(--text-muted); margin: 0; padding-left: 8px; font-weight: 500;">頛銝?..</p>
                    <button class="btn-icon" style="color: var(--text-muted); font-size: 16px; border: none; background: transparent; cursor: pointer; padding: 8px;" onclick="const icon = this.querySelector('i'); icon.classList.add('fa-spin'); setTimeout(() => window.location.reload(true), 300);"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                
                <!-- Hero Dashboard Card -->
                <div class="hero-card" style="background: #1c1c1e; border-radius: 32px; padding: 32px 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 24px;">
                    <!-- Top row -->
                    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px;">
                        <!-- Left: Eaten -->
                        <div style="text-align: center; flex: 1;">
                            <div id="cal-eaten" style="font-size: 28px; font-weight: 800; color: white;">0</div>
                            <div style="font-size: 13px; font-weight: 500; color: #8e8e93; margin-top: 4px;">?? kcal</div>
                        </div>
                        
                        <!-- Center: Arc -->
                        <div style="position: relative; width: 160px; height: 100px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;">
                            <svg viewBox="0 0 160 100" style="position: absolute; top: -10px; left: 0; width: 160px; height: 100px; overflow: visible;">
                                <path d="M 20 80 A 60 60 0 0 1 140 80" fill="none" stroke="#333336" stroke-width="14" stroke-linecap="round" />
                                <path id="cal-arc" d="M 20 80 A 60 60 0 0 1 140 80" fill="none" stroke="url(#arc-gradient)" stroke-width="14" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5" style="transition: stroke-dashoffset 1s ease-out;" />
                                <defs>
                                    <linearGradient id="arc-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                        <stop offset="0%" stop-color="#FFD479" />
                                        <stop offset="100%" stop-color="#FF9B8C" />
                                    </linearGradient>
                                </defs>
                            </svg>
                            <div id="cal-remaining" style="position: relative; z-index: 10; font-size: 34px; font-weight: 800; color: white; line-height: 1; margin-bottom: 2px;">0</div>
                            <div style="position: relative; z-index: 10; font-size: 13px; font-weight: 500; color: #8e8e93; display: flex; align-items: center; cursor: pointer;" onclick="showInfo('cals')">?拚? kcal <i class="fa-solid fa-circle-info" style="margin-left: 4px; font-size: 11px;"></i></div>
                        </div>

                        <!-- Right: Burned -->
                        <div style="text-align: center; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;">
                            <div style="cursor: pointer; display: inline-flex; align-items: baseline;" onclick="promptEditBurned()">
                                <span id="cal-burned" style="font-size: 28px; font-weight: 800; color: white; border-bottom: 2px dashed #8e8e93;">0</span>
                                <i class="fa-solid fa-pen" style="font-size: 10px; margin-left: 6px; color: #8e8e93;"></i>
                            </div>
                            <div style="font-size: 13px; font-weight: 500; color: #8e8e93; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap; cursor: pointer;" onclick="showInfo('burned')">
                                <span>?? kcal</span> <i class="fa-solid fa-circle-info" style="font-size: 11px;"></i>
                                <div id="cal-burned-time" style="font-size: 11px; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 8px; display: none; align-items: center;"><i class="fa-regular fa-clock" style="margin-right: 3px;"></i><span id="cal-burned-time-val">0</span>m</div>
                            </div>
                        </div>
                    </div>

                    <!-- Bottom row: Macros -->
                    <div style="position: relative;">
                        <div style="position: absolute; right: 0; bottom: -20px; font-size: 13px; color: #8e8e93; cursor: pointer; display: flex; align-items: center;" onclick="showInfo('macros')">
                            <i class="fa-solid fa-circle-info"></i>
                        </div>
                        <div style="display: flex; justify-content: space-between; gap: 12px; cursor: pointer;" onclick="showInfo('macros')">
                            <!-- Carbs -->
                        <div style="flex: 1; text-align: center;">
                            <div style="font-size: 13px; color: white; margin-bottom: 8px; font-weight: 600;">蝣單偌</div>
                            <div style="background: rgba(251, 191, 36, 0.2); height: 12px; border-radius: 6px; margin-bottom: 10px; position: relative; overflow: hidden;">
                                <div id="bar-carb" style="background: var(--carb-color); height: 100%; border-radius: 6px; width: 0%; transition: width 0.5s ease;"></div>
                            </div>
                            <div style="font-size: 12px; font-weight: bold; color: white;"><span id="val-carb">0</span><span style="font-size: 11px; color: #8e8e93; font-weight: 500; margin-left: 2px;">/<span id="tar-carb">200</span>g</span></div>
                        </div>

                        <!-- Protein -->
                        <div style="flex: 1; text-align: center;">
                            <div style="font-size: 13px; color: white; margin-bottom: 8px; font-weight: 600;">?鞈?/div>
                            <div style="background: rgba(56, 189, 248, 0.2); height: 12px; border-radius: 6px; margin-bottom: 10px; position: relative; overflow: hidden;">
                                <div id="bar-pro" style="background: var(--pro-color); height: 100%; border-radius: 6px; width: 0%; transition: width 0.5s ease;"></div>
                            </div>
                            <div style="font-size: 12px; font-weight: bold; color: white;"><span id="val-pro">0</span><span style="font-size: 11px; color: #8e8e93; font-weight: 500; margin-left: 2px;">/<span id="tar-pro">120</span>g</span></div>
                        </div>
                        
                        <!-- Fat -->
                        <div style="flex: 1; text-align: center;">
                            <div style="font-size: 13px; color: white; margin-bottom: 8px; font-weight: 600;">?</div>
                            <div style="background: rgba(167, 139, 250, 0.2); height: 12px; border-radius: 6px; margin-bottom: 10px; position: relative; overflow: hidden;">
                                <div id="bar-fat" style="background: var(--fat-color); height: 100%; border-radius: 6px; width: 0%; transition: width 0.5s ease;"></div>
                            </div>
                            <div style="font-size: 12px; font-weight: bold; color: white;"><span id="val-fat">0</span><span style="font-size: 11px; color: #8e8e93; font-weight: 500; margin-left: 2px;">/<span id="tar-fat">65</span>g</span></div>
                        </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Quick Add Actions -->
            <div class="quick-actions">
                <button class="action-btn" onclick="openFoodDB('breakfast')">
                    <div class="action-icon" style="background: rgba(251, 191, 36, 0.15);"><span class="iconify" data-icon="fluent-emoji-flat:cooking" style="font-size: 28px;"></span></div>
                    <span>?拚?</span>
                </button>
                <button class="action-btn" onclick="openFoodDB('lunch')">
                    <div class="action-icon" style="background: rgba(56, 189, 248, 0.15);"><span class="iconify" data-icon="fluent-emoji-flat:bento-box" style="font-size: 28px;"></span></div>
                    <span>??</span>
                </button>
                <button class="action-btn" onclick="openFoodDB('dinner')">
                    <div class="action-icon" style="background: rgba(167, 139, 250, 0.15);"><span class="iconify" data-icon="fluent-emoji-flat:fork-and-knife-with-plate" style="font-size: 28px;"></span></div>
                    <span>??</span>
                </button>
                <button class="action-btn" onclick="openFoodDB('snack')">
                    <div class="action-icon" style="background: rgba(255, 107, 107, 0.15);"><span class="iconify" data-icon="fluent-emoji-flat:cookie" style="font-size: 28px;"></span></div>
                    <span>??</span>
                </button>
                <button class="action-btn" onclick="openScanner()">
                    <div class="action-icon" style="background: var(--accent-primary); color: white;"><i class="fa-solid fa-camera"></i></div>
                    <span>??</span>
                </button>
            </div>

            <!-- Dashboard Tracking Cards -->
            <div class="tracking-cards" style="margin-bottom: 16px;">
                <div class="card track-card" style="position: relative;">
                    <button class="btn-icon" style="position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border: none; font-size: 14px; color: var(--text-muted);" onclick="showInfo('water')"><i class="fa-solid fa-circle-info"></i></button>
                    <h3 style="color: var(--accent-secondary); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;" onclick="document.querySelector('[data-target=&quot;view-log&quot;]').click()"><i class="fa-solid fa-droplet" style="margin-right: 6px;"></i> ?偌 <i class="fa-solid fa-chevron-right" style="font-size: 12px; margin-left: 6px;"></i></h3>
                    <div style="cursor: pointer; margin: 8px 0 12px 0; display: flex; flex-direction: column; align-items: center;" onclick="promptEditWater()">
                        <div style="font-size: 24px; font-weight: 700; display: inline-flex; align-items: baseline;">
                            <span id="water-val" style="border-bottom: 2px dashed var(--accent-secondary); padding-bottom: 2px;">0</span>
                            <i class="fa-solid fa-pen" style="font-size: 12px; margin-left: 6px; color: var(--accent-secondary);"></i>
                        </div>
                        <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">/ <span id="water-target">--</span> ml</div>
                    </div>
                    <div style="display: flex; gap: 8px; justify-content: center;">
                        <button id="btn-water-minus" class="btn-icon">-</button>
                        <button id="btn-water-plus" class="btn-icon">+</button>
                    </div>
                </div>
                <div class="card track-card" style="position: relative;">
                    <h3 style="color: #ffb86c; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;" onclick="document.querySelector('[data-target=\'view-overview\']').click()"><i class="fa-solid fa-weight-scale" style="margin-right: 6px;"></i> 擃? <i class="fa-solid fa-chevron-right" style="font-size: 12px; margin-left: 6px;"></i></h3>
                    <button class="btn-icon" style="position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border: none; font-size: 14px; color: #ffb86c;" onclick="document.querySelector('[data-target=\'view-overview\']').click()"><i class="fa-solid fa-chart-line"></i></button>
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 12px;">
                        <style>
                            input[type="number"].no-spinners::-webkit-inner-spin-button, 
                            input[type="number"].no-spinners::-webkit-outer-spin-button { 
                                -webkit-appearance: none; 
                                margin: 0; 
                            }
                        </style>
                        <div style="display: flex; align-items: baseline; justify-content: center; margin-bottom: 12px;">
                            <input type="number" step="0.1" id="daily-weight" class="input-field no-spinners" placeholder="頛詨" style="text-align: center; font-weight: 700; font-size: 24px; background: transparent; border: none; border-bottom: 2px solid var(--card-border); border-radius: 0; padding: 4px; width: 100px; margin: 0; -moz-appearance: textfield;">
                            <span style="font-size: 14px; color: var(--text-muted); margin-left: 8px;">kg</span>
                        </div>
                        <div style="display: flex; gap: 8px; justify-content: center;">
                            <button id="btn-weight-minus" class="btn-icon">-</button>
                            <button id="btn-weight-plus" class="btn-icon">+</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Log View -->
        <div id="view-log" class="view" style="padding-top: 0;">
            <header style="padding: 16px 0; position: sticky; top: 0; background: var(--bg-main); z-index: 10; margin-bottom: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <h2 id="log-view-title" style="font-size: 18px; margin: 0;">憌脤?蝝??(隞予)</h2>
                        <button class="btn-icon" style="border: none; background: transparent; font-size: 16px; color: var(--accent-primary); outline: none; padding: 4px;" onclick="openCalendarModal()"><i class="fa-regular fa-calendar"></i></button>
                    </div>
                    <div style="display: flex; gap: 4px; align-items: center;">
                        <button id="btn-clear" class="btn-icon" style="border:none;"><i class="fa-solid fa-trash"></i></button>
                        <button class="btn-icon" style="color: var(--text-muted); font-size: 16px; border: none; background: transparent; cursor: pointer; padding: 8px;" onclick="const icon = this.querySelector('i'); icon.classList.add('fa-spin'); setTimeout(() => window.location.reload(true), 300);"><i class="fa-solid fa-rotate-right"></i></button>
                    </div>
                </div>
                <div class="date-strip" style="display: flex; justify-content: space-between; align-items: center;">
                    <!-- Date items injected via JS -->
                </div>
            </header>

            <div id="all-logs">
                <!-- Grouped logs will be injected here -->
            </div>
        </div>

        <!-- VIEW: WORKOUT -->
        <div id="view-workout" class="view">
            <header style="padding: 16px 0; position: sticky; top: 0; background: var(--bg-main); z-index: 10; margin-bottom: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <h2 style="font-size: 18px; margin: 0;">??隤脰”</h2>
                        <button class="btn-icon" style="border: none; background: transparent; font-size: 16px; color: var(--accent-primary); outline: none; padding: 4px;" onclick="openCalendarModal()"><i class="fa-regular fa-calendar"></i></button>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <p id="workout-day-title" style="margin: 0; font-size: 14px; color: var(--accent-secondary); font-weight: 500;">頛銝?..</p>
                        <button class="btn-icon" style="color: var(--text-muted); font-size: 16px; border: none; background: transparent; cursor: pointer; padding: 8px;" onclick="const icon = this.querySelector('i'); icon.classList.add('fa-spin'); setTimeout(() => window.location.reload(true), 300);"><i class="fa-solid fa-rotate-right"></i></button>
                    </div>
                </div>
                <div class="date-strip" style="display: flex; justify-content: space-between; align-items: center;">
                    <!-- Date items injected via JS -->
                </div>
            </header>

            <!-- Workout List Container -->
            <div id="workout-list-container">
                <!-- Exercises will be injected here via JS -->
            </div>
            
            <button class="btn-secondary" style="width: 100%; margin-top: 16px; padding: 16px; border-radius: 16px; border: 1px dashed var(--card-border); background: transparent;" onclick="openAddExerciseModal()">
                <i class="fa-solid fa-plus"></i> ???啣???
            </button>
            
            <div style="text-align: center; margin-top: 16px;">
                <p style="font-size: 12px; color: var(--text-muted);">暺?隤脰”??嚗????啣?靘???/p>
            </div>
        </div>

        <!-- Overview View -->
        <div id="view-overview" class="view">
            <header style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h2 id="overview-greeting" style="font-size: 24px; font-weight: 700; color: var(--text-main); margin: 0;">蝮質汗</h2>
                    <p style="color: var(--text-muted); font-size: 12px; margin-top: 4px;">???函?憌脤???????/p>
                </div>
                <button class="btn-icon" style="color: var(--text-muted); font-size: 16px; border: none; background: transparent; cursor: pointer; padding: 8px;" onclick="const icon = this.querySelector('i'); icon.classList.add('fa-spin'); setTimeout(() => window.location.reload(true), 300);"><i class="fa-solid fa-rotate-right"></i></button>
            </header>

            <div class="card" style="margin-bottom: 16px; padding: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px;">
                    <h3 style="font-size: 16px;">擃?</h3>
                    <div style="font-size: 12px; color: var(--text-muted);"><span id="overview-current-weight" style="font-size: 16px; font-weight: bold; color: var(--text-main);">-- kg</span> <span style="opacity: 0.6;">/ ?桀?擃?</span></div>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; color: var(--text-muted); font-size: 13px;">
                    <button class="btn-icon" style="background: var(--bg-main); width: 28px; height: 28px; border-radius: 50%; border: none; color: var(--text-main);" onclick="overviewChangeWeek(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                    <span id="overview-weight-date-range" style="font-weight: bold;">--</span>
                    <button class="btn-icon" style="background: var(--bg-main); width: 28px; height: 28px; border-radius: 50%; border: none; color: var(--text-main);" onclick="overviewChangeWeek(1)"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                
                <div style="position: relative; height: 180px; width: 100%;">
                    <canvas id="overviewWeightChart"></canvas>
                </div>
            </div>

            <div class="card" style="margin-bottom: 16px; padding: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px;">
                    <h3 style="font-size: 16px;">?∟楝??/h3>
                    <div style="font-size: 12px; color: var(--text-muted);"><span id="overview-avg-cal" style="font-size: 16px; font-weight: bold; color: var(--text-main);">-- 憭批</span> <span style="opacity: 0.6;">/ 瘥撟喳?</span></div>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; color: var(--text-muted); font-size: 13px;">
                    <button class="btn-icon" style="background: var(--bg-main); width: 28px; height: 28px; border-radius: 50%; border: none; color: var(--text-main);" onclick="overviewChangeWeek(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                    <span id="overview-cal-date-range" style="font-weight: bold;">--</span>
                    <button class="btn-icon" style="background: var(--bg-main); width: 28px; height: 28px; border-radius: 50%; border: none; color: var(--text-main);" onclick="overviewChangeWeek(1)"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                
                <div style="position: relative; height: 180px; width: 100%;">
                    <canvas id="overviewCalorieChart"></canvas>
                </div>
            </div>
            
            <!-- Burned Chart -->
            <div class="card" style="margin-bottom: 16px; padding: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px;">
                    <h3 style="font-size: 16px;">??瘨?/h3>
                    <div style="font-size: 12px; color: var(--text-muted);"><span id="overview-avg-burned" style="font-size: 16px; font-weight: bold; color: var(--text-main);">-- kcal</span> <span style="opacity: 0.6;">/ 瘥撟喳?</span></div>
